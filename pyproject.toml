[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-support-resolution-agent"
version = "0.1.0"
description = "Guarded multi-agent delivery support workflow"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"